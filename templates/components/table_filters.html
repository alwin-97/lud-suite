<details class="table-filters" data-filter-table="{{ table_id }}" data-filter-fields="{{ fields }}" hidden>
    <summary class="button button--secondary"><i class="fi fi-rr-filter" aria-hidden="true"></i> <span data-filter-label>Filters</span></summary>
    <div class="table-filter-panel">
        <p class="table-filter-help">Select one or more options. Changes apply immediately.</p>
        <div class="table-filter-groups"></div>
        <button type="button" class="text-button" data-filter-clear disabled><i class="fi fi-rr-cross" aria-hidden="true"></i> Clear filters</button>
        <p class="table-filter-result" role="status" aria-live="polite"></p>
    </div>
</details>
