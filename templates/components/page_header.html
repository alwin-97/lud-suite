{# Rendered by {% page_header %}; the tag body becomes the actions slot. #}
<section class="page-heading{% if actions %} page-heading--split{% endif %}">
    <div>
        {% if eyebrow %}<p class="eyebrow">{{ eyebrow }}</p>{% endif %}
        <h1>{{ title }}</h1>
        {% if description %}<p>{{ description }}</p>{% endif %}
    </div>
    {% if actions %}<div class="page-heading-actions">{{ actions }}</div>{% endif %}
</section>
